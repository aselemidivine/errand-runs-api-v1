services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ERRANDRUNS_DB_PASSWORD}
    ports: ["1433:1433"]
    healthcheck: {test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"], interval: 10s, timeout: 5s, retries: 10}
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrations: "true"
      ConnectionStrings__SqlServer: Server=sql,1433;Database=ErrandRuns;User Id=sa;Password=${ERRANDRUNS_DB_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${ERRANDRUNS_JWT_KEY}
      GoogleMaps__Enabled: ${GOOGLE_MAPS_ENABLED:-false}
      GoogleMaps__ServerApiKey: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      GoogleMaps__PlacesBaseUrl: ${GOOGLE_MAPS_PLACES_BASE_URL:-https://places.googleapis.com}
      GoogleMaps__GeocodingBaseUrl: ${GOOGLE_MAPS_GEOCODING_BASE_URL:-https://geocode.googleapis.com}
      IpGeolocation__Enabled: ${IP_GEOLOCATION_ENABLED:-false}
      IpGeolocation__Provider: ${IP_GEOLOCATION_PROVIDER:-IpApiCo}
      IpGeolocation__BaseUrl: ${IP_GEOLOCATION_BASE_URL:-https://ipapi.co}
      ExternalServices__Paystack__Enabled: ${PAYSTACK_ENABLED:-false}
      ExternalServices__Paystack__SecretKey: ${PAYSTACK_SECRET_KEY:-}
      ExternalServices__Paystack__PublicKey: ${PAYSTACK_PUBLIC_KEY:-}
      ExternalServices__Paystack__WebhookSecret: ${PAYSTACK_WEBHOOK_SECRET:-}
      ExternalServices__SendGrid__Enabled: ${SENDGRID_ENABLED:-false}
      ExternalServices__SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
      ExternalServices__SendGrid__FromEmail: ${SENDGRID_FROM_EMAIL:-}
      ExternalServices__SendGrid__FromName: ${SENDGRID_FROM_NAME:-ErrandRuns}
      ExternalServices__Termii__Enabled: ${TERMII_ENABLED:-false}
      ExternalServices__Termii__ApiKey: ${TERMII_API_KEY:-}
      ExternalServices__Termii__SenderId: ${TERMII_SENDER_ID:-ErrandRuns}
      ExternalServices__Termii__BaseUrl: ${TERMII_BASE_URL:-https://api.ng.termii.com}
      ExternalServices__SmileIdentity__Enabled: ${SMILE_IDENTITY_ENABLED:-false}
      ExternalServices__SmileIdentity__PartnerId: ${SMILE_IDENTITY_PARTNER_ID:-}
      ExternalServices__SmileIdentity__ApiKey: ${SMILE_IDENTITY_API_KEY:-}
      ExternalServices__SmileIdentity__WebhookSecret: ${SMILE_IDENTITY_WEBHOOK_SECRET:-}
      ExternalServices__AzureBlobStorage__Enabled: ${AZURE_BLOB_ENABLED:-false}
      ExternalServices__AzureBlobStorage__ConnectionString: ${AZURE_BLOB_CONNECTION_STRING:-}
      ExternalServices__AzureBlobStorage__PrivateContainer: ${AZURE_BLOB_PRIVATE_CONTAINER:-errandruns-private}
      ExternalServices__Firebase__Enabled: ${FIREBASE_ENABLED:-false}
      ExternalServices__Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      ExternalServices__Firebase__ServiceAccountJsonBase64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}
      ExternalServices__OpenTelemetry__Enabled: ${OTEL_ENABLED:-false}
      ExternalServices__OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ExternalServices__OpenTelemetry__OtlpHeaders: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports: ["8080:8080"]
    depends_on: {sql: {condition: service_healthy}}
